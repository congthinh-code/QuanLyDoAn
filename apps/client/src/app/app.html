<!-- Hiển thị trang Login nếu chưa có Token -->
<app-login
  *ngIf="!isLoggedIn"
  (loggedIn)="checkLoginStatus()">
</app-login>

<!-- Hiển thị Profile và Topic List nếu đã đăng nhập -->
<div *ngIf="isLoggedIn">

  <app-profile
    (loggedOut)="checkLoginStatus()">
  </app-profile>

  <hr style="margin: 20px 0;">

  <app-topic-list>
  </app-topic-list>

</div>

<!-- Khu vực hiển thị route -->
<router-outlet></router-outlet>
